services:
  db:
    image: pgvector/pgvector:pg16
    container_name: image_matching_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: ${POSTGRES_DB:-image_matching}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: